<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" fill="#1A1A1A"/>
  
  <!-- Sticker 1: Bitcoin circle - tilted -->
  <g transform="translate(80, 60) rotate(-5)">
    <circle cx="60" cy="60" r="55" fill="#F7931A" stroke="#0D0D0D" stroke-width="4"/>
    <text x="60" y="78" text-anchor="middle" font-family="Arial Black" font-size="50" fill="#0D0D0D">₿</text>
  </g>
  
  <!-- Sticker 2: HODL rectangle -->
  <g transform="translate(200, 40) rotate(3)">
    <rect x="0" y="0" width="120" height="50" fill="#FF4136" stroke="#0D0D0D" stroke-width="4"/>
    <text x="60" y="36" text-anchor="middle" font-family="Arial Black" font-size="28" fill="#0D0D0D">HODL</text>
  </g>
  
  <!-- Sticker 3: Stack Sats -->
  <g transform="translate(40, 180) rotate(-3)">
    <rect x="0" y="0" width="140" height="45" fill="#0D0D0D" stroke="#F7931A" stroke-width="3"/>
    <text x="70" y="32" text-anchor="middle" font-family="Arial Black" font-size="20" fill="#F7931A">STACK SATS</text>
  </g>
  
  <!-- Sticker 4: 21M circle -->
  <g transform="translate(220, 150) rotate(5)">
    <circle cx="50" cy="50" r="45" fill="#FDF6E3" stroke="#0D0D0D" stroke-width="4"/>
    <text x="50" y="55" text-anchor="middle" font-family="Arial Black" font-size="26" fill="#0D0D0D">21M</text>
    <text x="50" y="72" text-anchor="middle" font-family="Arial" font-size="10" fill="#0D0D0D">ONLY</text>
  </g>
  
  <!-- Sticker 5: Lightning bolt -->
  <g transform="translate(130, 270) rotate(-8)">
    <rect x="0" y="0" width="100" height="100" fill="#F7931A" stroke="#0D0D0D" stroke-width="4"/>
    <path d="M50 15 L30 55 L45 55 L35 85 L70 45 L55 45 L65 15 Z" fill="#0D0D0D"/>
  </g>
  
  <!-- Sticker 6: Proof of Work banner -->
  <g transform="translate(240, 280) rotate(4)">
    <rect x="0" y="0" width="130" height="40" fill="#FF4136" stroke="#0D0D0D" stroke-width="3"/>
    <text x="65" y="28" text-anchor="middle" font-family="Arial Black" font-size="14" fill="#FDF6E3">PROOF OF WORK</text>
  </g>
  
  <!-- Decorative corner accents -->
  <rect x="0" y="0" width="60" height="8" fill="#F7931A"/>
  <rect x="0" y="0" width="8" height="60" fill="#F7931A"/>
  <rect x="340" y="0" width="60" height="8" fill="#F7931A"/>
  <rect x="392" y="0" width="8" height="60" fill="#F7931A"/>
  <rect x="0" y="392" width="60" height="8" fill="#F7931A"/>
  <rect x="0" y="340" width="8" height="60" fill="#F7931A"/>
  <rect x="340" y="392" width="60" height="8" fill="#F7931A"/>
  <rect x="392" y="340" width="8" height="60" fill="#F7931A"/>
</svg>
