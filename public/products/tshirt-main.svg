<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Background -->
  <rect width="400" height="400" fill="#1A1A1A"/>
  
  <!-- T-shirt shape -->
  <path d="M100 80 L160 80 L180 60 L220 60 L240 80 L300 80 L320 140 L280 160 L280 340 L120 340 L120 160 L80 140 Z" 
        fill="#0D0D0D" stroke="#F7931A" stroke-width="4"/>
  
  <!-- Collar -->
  <ellipse cx="200" cy="80" rx="40" ry="20" fill="#1A1A1A" stroke="#F7931A" stroke-width="3"/>
  
  <!-- Bitcoin symbol on chest -->
  <circle cx="200" cy="200" r="50" fill="#F7931A" stroke="#0D0D0D" stroke-width="4"/>
  <text x="200" y="220" text-anchor="middle" font-family="Arial Black" font-size="60" font-weight="900" fill="#0D0D0D">₿</text>
  
  <!-- "PROOF OF WORK" text below -->
  <text x="200" y="290" text-anchor="middle" font-family="Arial Black" font-size="16" fill="#F7931A">PROOF OF WORK</text>
  
  <!-- Decorative corner accents -->
  <rect x="0" y="0" width="60" height="8" fill="#FF4136"/>
  <rect x="0" y="0" width="8" height="60" fill="#FF4136"/>
  <rect x="340" y="0" width="60" height="8" fill="#FF4136"/>
  <rect x="392" y="0" width="8" height="60" fill="#FF4136"/>
  <rect x="0" y="392" width="60" height="8" fill="#FF4136"/>
  <rect x="0" y="340" width="8" height="60" fill="#FF4136"/>
  <rect x="340" y="392" width="60" height="8" fill="#FF4136"/>
  <rect x="392" y="340" width="8" height="60" fill="#FF4136"/>
</svg>
