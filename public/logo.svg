<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <!-- Main text: PROOF -->
  <text x="0" y="65" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="72" font-weight="900" fill="#0D0D0D" letter-spacing="2">
    PR
  </text>
  
  <!-- Bitcoin O replacement -->
  <g transform="translate(82, 12)">
    <circle cx="28" cy="35" r="26" fill="#F7931A" stroke="#0D0D0D" stroke-width="4"/>
    <text x="28" y="47" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#0D0D0D" text-anchor="middle">₿</text>
  </g>
  
  <!-- Rest of PROOF -->
  <text x="136" y="65" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="72" font-weight="900" fill="#0D0D0D" letter-spacing="2">
    OF
  </text>
  
  <!-- Small "of" connector -->
  <text x="228" y="65" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="700" fill="#F7931A">
    of
  </text>
  
  <!-- WEAR -->
  <text x="268" y="65" font-family="'Bebas Neue', 'Arial Black', sans-serif" font-size="72" font-weight="900" fill="#0D0D0D" letter-spacing="2">
    WEAR
  </text>
  
  <!-- Accent underline -->
  <rect x="0" y="80" width="400" height="8" fill="#F7931A"/>
  
  <!-- Corner accents -->
  <rect x="0" y="0" width="20" height="4" fill="#FF4136"/>
  <rect x="0" y="0" width="4" height="20" fill="#FF4136"/>
</svg>
